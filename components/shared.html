<!-- 
    SHARED HTML COMPONENTS
    Reusable HTML snippets for all game modes
-->

<!-- TABLE HEADERS -->
<template id="table-headers">
    <thead>
        <tr>
            <th style="width: 14%;">Item Info</th>
            <th style="width: 11%;">
                <div class="tooltip">Rarity
                    <span class="tooltiptext">The structure tier of the item in shop pathing.<br><b>Example:</b> Starter (Doran's Shield), Epic (Hextech Alternator), or Legendary (Rabadon's).</span>
                </div>
            </th>
            <th style="width: 13%;">
                <div class="tooltip">Class Pool
                    <span class="tooltiptext">Recommended user class archetype in Summoner's Rift shop tabs for legendary items.<br><b>Classes:</b> Mage, Tank, Fighter, Assassin, Support, Marksman.</span>
                </div>
            </th>
            <th style="width: 11%;">
                <div class="tooltip">Gold Value
                    <span class="tooltiptext">Total purchase price of the complete item. Gives direction arrows.</span>
                </div>
            </th>
            <th style="width: 14%;">
                <div class="tooltip">Primary Stats
                    <span class="tooltiptext">Base stats/attributes granted by the item. Green on perfect match, Yellow on partial overlap.</span>
                </div>
            </th>
            <th style="width: 9%;">
                <div class="tooltip">Active?
                    <span class="tooltiptext">Whether the item has a click-activated active ability. <br><b>Examples:</b> Zhonya's, Tiamat.</span>
                </div>
            </th>
            <th style="width: 15%;">
                <div class="tooltip">Common Components
                    <span class="tooltiptext">Shows any overlapping ingredients or recipe paths with target.</span>
                </div>
            </th>
            <th style="width: 13%;">
                <div class="tooltip">Item Group
                    <span class="tooltiptext">Classifies items with unique named passives that don't stack.<br><b>Example:</b> Lifeline (Sterak's / Maw) or Spellblade (Sheen / Lich Bane)</span>
                </div>
            </th>
        </tr>
    </thead>
</template>

<!-- SETTINGS MODAL -->
<template id="settings-modal">
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Game Settings</h2>
                <button id="closeSettingsBtn" class="close-modal-btn">&times;</button>
            </div>
            
            <div class="setting-row">
                <span class="setting-label">
                    <b>Colorblind Mode</b><br>
                    <small style="color:#a0a0a0;">Changes indicators to Blue / Yellow / Orange</small>
                </span>
                <label class="switch">
                    <input type="checkbox" id="colorblindToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
</template>

<!-- PATCH NOTES MODAL -->
<template id="patch-notes-modal">
    <div id="patchNotesModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Changelog / Patch Notes</h2>
                <button id="closeModalBtn" class="close-modal-btn">&times;</button>
            </div>
            <div id="patchNotesContainer"></div>
        </div>
    </div>
</template>

<!-- DEV PANEL -->
<template id="dev-panel">
    <div class="dev-panel" id="devPanel">
        <div><strong>Dev Console:</strong> Target Answer: <span id="devTarget" style="color:#c8aa6e;">Loading...</span></div>
    </div>
</template>
